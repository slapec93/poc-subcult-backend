name: subcult

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      retries: 30

  backend:
    build:
      context: .
      args:
        PKG: backend
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build:
      context: .
      args:
        PKG: indexer
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./packages/frontend/public:/usr/share/nginx/html:ro
      - ./packages/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  anvil:
    profiles: [anvil]
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil --host 0.0.0.0 --chain-id 31337 --block-time 2"]
    ports:
      - "8545:8545"

  deploy-contract:
    profiles: [anvil]
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /contracts
    volumes:
      - ./contracts:/contracts
    command:
      - >-
        [ "$$(cast code 0x5FbDB2315678afecb367f032d93F642f64180aa3 --rpc-url http://anvil:8545)" != "0x" ]
        && echo "Notify already deployed"
        || forge create Notify.sol:Notify --broadcast
        --rpc-url http://anvil:8545
        --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    depends_on:
      - anvil

volumes:
  postgres-data:

name: subcult

services:
  backend:
    build:
      context: .
      args:
        PKG: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BEE_URL: ${BEE_URL:-http://bee:1633}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    networks:
      - default
      - swarm
      - db
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  indexer:
    build:
      context: .
      args:
        PKG: indexer
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      BEE_URL: ${BEE_URL:-http://bee:1633}
    networks:
      - swarm
      - db

networks:
  # Shared with the bee-services project, which serves Bee as `bee:1633`.
  swarm:
    external: true
  # The postgres project's default network, where the database resolves as `postgres`.
  db:
    external: true
    name: ${DB_NETWORK:-postgres_default}
